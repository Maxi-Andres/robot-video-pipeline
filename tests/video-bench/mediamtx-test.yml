# Isolated twin of the production mediamtx.yml, on shifted ports.
#
# Why a second instance and not the live one: the production instance is the robot's RTMP
# target and Frigate's RTSP source. Publishing a test pattern into it would land in the NVR
# recordings and fight the robot for the `robot` path. Every latency-relevant setting here is
# the stock default, exactly as in production — only the addresses differ — so the number
# this instance yields transfers.
logLevel: info

# The loopback UDP hop from srt-live-transmit is where frames were being lost, and the
# default 212 KB socket buffer is why. MEASURED 2026-09-14: the robot's pipeline emits a
# steady 4.55 fps, SRT delivers it with 0 packets dropped, and mediamtx still saw only
# 3.86 fps — 15% gone — with the kernel counting UdpRcvbufErrors. Keyframes arrive as a
# burst, so a burst is exactly what overflows a small buffer, and one lost keyframe fragment
# costs everything up to the NEXT keyframe: the browser showed 20 freezes totalling 64 s.
# Capped by net.core.rmem_max, which is 4 MB here.
udpReadBufferSize: 4194304

rtsp: yes
rtspAddress: :18554
rtpAddress: :18000
rtcpAddress: :18001
rtspTransports: [tcp, udp]   # as in production; also keeps the multicast listeners out of the way

hls: no

webrtc: yes
webrtcAddress: :18889
webrtcLocalUDPAddress: :18189

rtmp: yes
rtmpAddress: :11935

srt: no

# On in the test twin only: the production config has `api: no`, which is exactly why there
# is no programmatic way to see publishers and readers when diagnosing (noted as a risk in
# the plan). Here it costs nothing and shows whether the publisher really attached.
api: yes
apiAddress: :19997

metrics: no
pprof: no
playback: no

paths:
  lat:
    source: publisher
  # target for the robot-side encoder diagnostic, so it never publishes into production
  diag:
    source: publisher
  # The SRT path under test: srt-live-transmit listens for the robot and forwards the
  # MPEG-TS here over loopback, where nothing can be lost. Syntax verified against
  # mediamtx.stock.yml for v1.19.2, which documents udp+mpegts://ip:port as "the stream is
  # pulled from MPEG-TS over UDP, by listening on the specified address".
  srtin:
    source: udp+mpegts://127.0.0.1:9000

moq: no
