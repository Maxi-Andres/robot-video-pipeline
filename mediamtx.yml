# Minimal low-latency mediamtx config for the robot -> NVR bridge.
# Omitted keys fall back to mediamtx's built-in defaults. Full reference config is
# kept alongside as mediamtx.stock.yml.

logLevel: info

# --- RTSP: what the NVR pulls, and what our ffmpeg pushes to ---
rtsp: yes
rtspAddress: :8554
rtspTransports: [tcp, udp]

# --- HLS: browser fallback (no NVR needed) -> http://<host>:8888/robot ---
hls: yes
hlsAddress: :8888
hlsVariant: lowLatency

# --- WebRTC: lowest-latency browser view -> http://<host>:8889/robot ---
webrtc: yes
webrtcAddress: :8889
# TLS on the WebRTC endpoint, and it is not optional once the app is served over HTTPS.
# The page derives the WHEP URL from its own origin, so on https it asks for https — and even
# if it asked for http, a browser refuses mixed content from a secure page. Without this the
# H.264 transport switch shows "connecting" and falls straight back to MJPEG, which is exactly
# what it did. Same self-signed pair the rest of this stack uses; a browser needs the
# exception accepted once per PORT, so visit https://<host>:8889/ and accept it.
webrtcEncryption: yes
webrtcServerKey: auto.key
webrtcServerCert: auto.crt

# Unused ingress/servers off.
rtmp: yes
rtmpAddress: :1935   # robot-side publisher (libsrt 1.4.0 on the robot is incompatible with mediamtx SRT)
srt: yes
srtAddress: :8890   # enabled but UNUSABLE from the robot: its libsrt 1.4.0 is incompatible
                    # with mediamtx SRT. The robot publishes over RTMP instead. See
                    # robot/run-video.sh for the bisect that proved it.
api: no
metrics: no
pprof: no

paths:
  # ffmpeg publishes to rtsp://127.0.0.1:8554/robot; NVR / VLC / browser read the
  # same path. source: publisher = the stream is pushed to us (not pulled by us).
  robot:
    source: publisher
